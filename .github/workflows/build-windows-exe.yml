name: Build Windows EXE

on:
  workflow_dispatch:       # Run manually from GitHub UI
  push:
    tags:
      - "v*"               # Also auto-run on version tags (e.g. v0.1.62)

permissions:
  contents: write          # Needed to upload release assets

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install uv
        run: pip install uv

      - name: Install project dependencies
        run: uv sync --all-extras

      - name: Install PyInstaller
        run: uv run pip install pyinstaller

      - name: Build EXE with PyInstaller
        run: uv run python -m PyInstaller fimeval_gui.spec --noconfirm

      - name: Zip the output
        run: Compress-Archive -Path dist\FIMeval -DestinationPath FIMeval_Windows.zip
        shell: pwsh

      - name: Upload EXE as artifact
        uses: actions/upload-artifact@v4
        with:
          name: FIMeval-Windows
          path: FIMeval_Windows.zip
          retention-days: 30

      # If triggered by a version tag, also attach to GitHub Release
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: FIMeval_Windows.zip
